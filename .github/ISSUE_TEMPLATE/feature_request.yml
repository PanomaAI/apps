name: Feature proposal
description: Something an app should do but does not do today
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Each app has a deliberately narrow purpose. panoma video makes videos **about
        software, from the software itself** — facts from the repository, footage from the
        running product, a review before anything is called done. Saying no to good ideas
        outside that purpose is part of maintaining it, so the important question is the
        problem rather than the feature itself.
  - type: dropdown
    id: app
    attributes:
      label: App
      options:
        - panoma video
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe it without assuming a solution. What were you trying to do, and where did you get stuck?
      placeholder: My product's key screen only appears after a login, and the tour never reaches it.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How do you solve it today?
      description: Include manual workarounds or other tools. This helps establish whether the problem is worth solving here.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What approach do you have in mind?
      description: Optional. Share a possible shape for the solution if you already have one.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I read the app's docs/roadmap.md to see whether this is already planned
          required: true
