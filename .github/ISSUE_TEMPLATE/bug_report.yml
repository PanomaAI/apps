name: Bug report
description: Something is not working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting this. A reproduction saves the most time. If you do not know
        one of the optional details below, leave it blank and submit the rest.

        If you found a **security vulnerability**, do not publish it here. Follow
        [SECURITY.md](../blob/HEAD/SECURITY.md).
  - type: dropdown
    id: app
    attributes:
      label: App
      options:
        - panoma video
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include what you expected to happen instead.
      placeholder: panoma-video auto ~/my-project stops after the record stage and the workspace has no renders.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Provide the exact commands in order, copied as you ran them.
      placeholder: |
        1. npm install -g @panoma/video
        2. panoma-video doctor --json
        3. panoma-video auto ~/my-project --until=preview
      render: shell
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Terminal output
      description: Include the complete error and stack trace. Remove any key or private path you do not want to publish.
      render: shell
  - type: input
    id: version
    attributes:
      label: Version
      description: For panoma video, the output of `npm ls -g @panoma/video`, the version on the catalog's Apps screen, or the commit hash when working from source.
      placeholder: 0.9.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Requirements probe
      description: For panoma video, the output of `panoma-video doctor --json`. It names the browser and the encoder the app found, which is where most reports end.
      render: json
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched for an existing issue about this problem
          required: true
        - label: I checked that the report contains no keys or private paths
          required: true
